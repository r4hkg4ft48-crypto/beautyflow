<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>В Лепёшке</title>
<style>
html,body{margin:0;min-height:100%;background:#06101d;color:#f7fbff;font:15px/1.4 -apple-system,BlinkMacSystemFont,Inter,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
b{font-size:22px}small{display:block;margin-top:8px;color:#9fb2c6}
</style>
</head>
<body><main><div><b>В Лепёшке</b><small>Подключаем актуальное приложение…</small></div></main>
<script>
(function(){
  var src=new URL(location.href);
  var target=new URL("https://shaurma-city-app.onrender.com/");
  src.searchParams.forEach(function(v,k){if(k!=="b")target.searchParams.set(k,v)});
  target.searchParams.set("source","lepesh-legacy");
  target.searchParams.set("b","86");
  var hasLaunchVenue=src.searchParams.has("venue")||src.searchParams.has("tgWebAppStartParam")||/tgWebAppStartParam=venue_/i.test(src.hash||"");
  if(!hasLaunchVenue){
    target.searchParams.set("venue","lepyoshka");
    target.searchParams.set("establishment","SC-MSK-B7441AB59F");
    target.searchParams.set("marker","1");
    target.searchParams.set("context","marker");
    target.searchParams.set("view","menu");
  }
  target.hash=src.hash||"";
  location.replace(target.toString());
})();
</script></body></html>
